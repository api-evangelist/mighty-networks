aid: mighty-networks
url: https://raw.githubusercontent.com/api-evangelist/mighty-networks/refs/heads/main/apis.yml
name: Mighty Networks
kind: company
description: Mighty Networks is a community, courses, and membership platform where
  creators, brands, and businesses run branded networks made up of spaces, members,
  posts, events, courses, and paid plans. After years of offering only a Zapier
  integration, Mighty Networks now ships a documented public Admin API - a REST
  interface (OpenAPI 3.1, base https://api.mn.co/admin/v1) authenticated with a
  Bearer API token for managing members, spaces, posts, events, courses, plans,
  subscriptions, badges, tags, custom fields, and invites - plus a beta Headless
  GraphQL API for building custom user-context clients and 40-plus outbound webhook
  event types. API access requires a Scale, Growth, or Mighty Pro plan.
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
tags:
- Community
- Courses
- Membership
- Creator Economy
- Events
- Subscriptions
created: '2026-07-05'
modified: '2026-07-05'
specificationVersion: '0.19'
