    type: Documentation
  - url: https://docs.mightynetworks.com/headless-authentication
    type: Authentication
  description: >-
    Beta GraphQL interface that powers the official Mighty Networks clients, for building custom user-context
    clients, integrations, and back-office tools. Requests go to /networks/:network_id_or_subdomain/graphql
    and use OAuth 2.0 short-lived access tokens acting on behalf of a specific member, moderator, or host.
    Available on Mighty Pro.
