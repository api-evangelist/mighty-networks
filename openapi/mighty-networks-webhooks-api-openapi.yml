          example: '2026-07-05T21:11:43+00:00'
        updated_at:
          type: string
          format: date-time
          description: The date and time the record was last modified
          example: '2026-07-05T21:11:43+00:00'
        user_id:
          type: integer
          format: uint64
          description: The ID of the user who reported the content
        targetable_id:
          type: integer
          format: uint64
          description: The ID of the reported content
        targetable_type:
