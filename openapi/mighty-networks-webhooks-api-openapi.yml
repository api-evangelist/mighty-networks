components:
  schemas:
    MemberTagAddPayload:
      description: Payload sent when a tag is added to a member
      type: object
      required:
      - member
      - network_id
      - tag
      properties:
        member:
          description: The member who received the tag
          $ref: '#/components/schemas/MemberResponse'
        tag:
          description: The tag that was added
          $ref: '#/components/schemas/TagResponse'
        network_id:
          type: integer
          format: uint64
          description: The ID of the network
    GiftLeaderboardUpdatedPayload:
      description: Payload sent when a gift leaderboard is updated for a network
      type: object
      required:
      - entries
      - network_id
      - recalculated_at
      - type
      properties:
        network_id:
          type: integer
          format: uint64
          description: The ID of the network
        recalculated_at:
          type: string
          format: date-time
          description: When the leaderboard was recalculated
          example: '2026-07-05T21:11:42+00:00'
        type:
          type: string
          description: 'The leaderboard type: received or sent'
          enum:
          - received
          - sent
        gift_definition:
          description: The gift definition for per-definition leaderboards
          $ref: '#/components/schemas/GiftDefinitionResponse'
        entries:
          description: Entries grouped by aggregation period
          $ref: '#/components/schemas/GiftLeaderboardEntriesByPeriodResponse'
    GiftLeaderboardEntryResponse:
      description: A single ranked entry in a gift leaderboard
      type: object
      required:
      - count
      - member
      - rank
      properties:
        rank:
          type: integer
          format: uint64
          description: 1-indexed position on the leaderboard
        member:
          description: The member for this entry
          $ref: '#/components/schemas/MemberResponse'
        count:
          type: integer
          format: uint64
          description: Gift count for the corresponding period
    EventInstanceResponse:
      description: A specific instance of a recurring event
      type: object
      required:
      - ends_at
      - instance_index
      - post_id
      - starts_at
      properties:
        post_id:
          type: integer
          format: uint64
          description: The ID of the recurring event post
        starts_at:
          type: string
          format: date-time
          description: Start time of this specific instance
          example: '2026-07-05T21:11:42+00:00'
        ends_at:
          type: string
          format: date-time
          description: End time of this specific instance
          example: '2026-07-05T21:11:42+00:00'
        instance_index:
          type: integer
          format: uint64
          description: The index of this instance in the recurrence series
    TagResponse:
      description: Tags are custom field values used to categorize and label members
      type: object
      required:
      - created_at
      - custom_field_id
      - id
      - title
      - updated_at
      properties:
        id:
          type: integer
          format: uint64
          description: The record's integer ID
          example: '1234'
        created_at:
          type: string
          format: date-time
          description: The date and time the record was created
          example: '2026-07-05T21:11:41+00:00'
        updated_at:
          type: string
          format: date-time
          description: The date and time the record was last modified
          example: '2026-07-05T21:11:41+00:00'
        title:
          type: string
          description: The title of the tag
          example: VIP Member
        description:
          type: string
          description: The description of the tag
          example: Premium tier members
        color:
          type: string
          description: The hex color code for the tag
          example: '#FF5733'
        custom_field_id:
          type: integer
          format: uint64
          description: The ID of the custom field this tag belongs to
    CustomFieldResponseUpdatedPayload:
      description: Payload sent when a member updates their custom field response
      type: object
      required:
      - custom_field
      - member
      - network_id
      properties:
        member:
          description: The member who updated their response
          $ref: '#/components/schemas/MemberResponse'
        custom_field:
          description: The custom field that was updated
          $ref: '#/components/schemas/CustomFieldResponse'
        network_id:
          type: integer
          format: uint64
          description: The ID of the network
        previous_text:
          type: string
          description: Previous text value (for text-based custom fields)
        new_text:
          type: string
          description: New text value (for text-based custom fields)
        previous_segments:
          type: array
          description: Previous segments (for dropdown custom fields)
          items:
            $ref: '#/components/schemas/SegmentResponse'
        new_segments:
          type: array
          description: New segments (for dropdown custom fields)
          items:
            $ref: '#/components/schemas/SegmentResponse'
    HotColdPollCreatePayload:
      description: Payload sent when a hot/cold poll is created
      type: object
      required:
      - created_at
      - creator
      - id
      - permalink
      - post_type
      - space
      - title
      - updated_at
      properties:
        id:
