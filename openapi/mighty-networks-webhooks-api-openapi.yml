    ReactionResponse:
      description: A reaction to a post or comment
      type: object
      required:
      - base_emoji
      - created_at
      - emoji
      - id
      - member_id
      - network_id
      - space_id
      - targetable_id
      - targetable_space_id
      - targetable_type
      - updated_at
      properties:
        id:
          type: integer
          format: uint64
          description: The record's integer ID
          example: '1234'
        created_at:
          type: string
          format: date-time
          description: The date and time the record was created
          example: '2026-07-05T21:11:41+00:00'
        updated_at:
          type: string
          format: date-time
          description: The date and time the record was last modified
          example: '2026-07-05T21:11:41+00:00'
        space_id:
          type: integer
          format: uint64
          description: The ID of the space where the reaction was created
          example: 123
        network_id:
          type: integer
          format: uint64
          description: The ID of the network where the reaction was created
          example: 100
        targetable_id:
          type: integer
          format: uint64
          description: The ID of the post or comment being reacted to
          example: 456
        targetable_type:
          type: string
